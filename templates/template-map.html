<meta charset="utf-8">
<title>PROJECT NAME — Knowledge Map</title>
<!--
  template-map.html — the hsdk knowledge-map template (companion to the explainer field guide).
  A pannable, zoomable graph of a site's topic pages: hover peeks, a reader panel per node, a
  guided "journey" through the pages in narrative order, a legend that dims groups, and the same
  three-state theme as the other templates. One self-contained file, no external resources.

  STRUCTURE — two halves, one contract:
    1. DATA   — everything between the "DATA START" and "DATA END" markers in the <script>:
       SITE (the per-site strings), GROUPS, NODES, JOURNEY, EDGES, ZONES. Replace ALL of it per
       project. The shipped values are a complete worked example (a credential-pool subsystem) —
       study them, then replace them. The ONE edit outside DATA is the <title> tag (it is what
       shows before scripts run); the bar title, the journey strip, the switcher and the theme
       key are written from SITE at load, so their placeholders below are overwritten.
    2. ENGINE — everything after "DATA END". DO NOT EDIT it. It validates DATA at load (problems
       go to the console AND a red banner on the map), sizes the world from ZONES, routes edges
       orthogonally with bridge hops, and implements the interaction contract the explainer skill
       documents. `templates/check-map <file>` runs the same validator from the command line and
       also checks that every node's topics/<id>.html exists.

  DATA RULES the validator enforces:
  - node.id matches the topic page filename: topics/<id>.html
  - node.what is an ARRAY of 2–3 fact strings (may contain <b>), never a prose paragraph
  - every node box (NODE_W × NODE_H = 176 × 84, centred on x,y) sits FULLY INSIDE its group's
    zone; zones do not overlap; nodes do not overlap; a node carrying a journey stage needs 12px
    extra clearance on its top and right — to the zone edge, to neighbouring cards, and to
    passing edges (the stage badge and its ground ring stick out)
  - every edge carries a one-line "why these connect"; 4th element 1 = panel-only (listed in the
    reader panel, not drawn) — use it for any relation that would cross most of the map
  - JOURNEY ids exist in NODES; stages are numbered 1..n in narrative order; at least one stage
  - every drawn edge has at least one orthogonal route (straight, one bend, or two bends through
    the midpoint) that crosses no other node — move nodes, or mark the edge panel-only
  - node.what entries each open with a bolded lead-in: "<b>Lead:</b> rest of the fact"; titles
    and teasers are plain text, titles at most 44 characters (two lines on the card); group
    names are plain text, at most 24 characters (one-line labels)
  - SITE.themeKey is the ONE key every page of the site shares; SITE.title replaces PROJECT NAME
-->

  .legend {

  /* ── map viewport ── */
  #viewport { position: absolute; inset: 0; cursor: grab; touch-action: none;
    background-image: radial-gradient(var(--dot-grid) 1.2px, transparent 1.2px); background-size: 26px 26px; }
  #viewport.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; } /* size is set by the engine from ZONES */
  #edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #edges path.e { fill: none; stroke: var(--line-strong); stroke-width: 1.6; transition: stroke .18s, opacity .18s, stroke-width .18s; }
  #edges path.hit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }
  #edges path.e.hl { stroke: var(--hlc, var(--accent)); stroke-width: 2.6; }
  #edges path.e.dim { opacity: .16; }
  #edges path.j { fill: none; stroke: var(--journey); stroke-width: 3; stroke-dasharray: 7 7; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #edges path.j.on { opacity: .95; animation: march 1.2s linear infinite; }

  @media (prefers-reduced-motion: reduce) { #edges path.j.on { animation: none; } }

    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 11px;

  #peek .pd { margin: 7px 0 0; font-size: 12px; color: var(--ink-soft); }

</style>

    var tag = "JOURNEY[" + i + "]";
    if (!seen[s.id]) p.push(tag + ": unknown id '" + s.id + "'");
    if (s.n !== i + 1) p.push(tag + ": n is " + s.n + ", expected " + (i + 1) + " (stages run 1..n in order)");
    if (!isStr(s.t) || !isStr(s.d)) p.push(tag + ": needs t (stage title) and d (what happens)");
  });
  return p;
}
/* the well-formed subset the engine can safely build over — the validator has already named what is dropped */
function normalizeMapData(GROUPS, NODES, EDGES, ZONES, JOURNEY) {
  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function isStr(s) { return typeof s === "string" && s.trim().length > 0; }
  var G = Object.create(null);
  if (GROUPS && typeof GROUPS === "object" && !Array.isArray(GROUPS)) Object.keys(GROUPS).forEach(function (g) {
    var grp = GROUPS[g];
    if (grp && typeof grp === "object" && !Array.isArray(grp) && isStr(grp.name) && isStr(grp.c)) G[g] = grp;
  });
  var Zs = Array.isArray(ZONES) ? ZONES : [], Ns = Array.isArray(NODES) ? NODES : [], Es = Array.isArray(EDGES) ? EDGES : [], Js = Array.isArray(JOURNEY) ? JOURNEY : [];
  var zones = Zs.filter(function (z) {
    return Array.isArray(z) && z.length === 5 && G[z[0]] && isNum(z[1]) && isNum(z[2]) && isNum(z[3]) && z[3] > 0 && isNum(z[4]) && z[4] > 0;
  });
  var seen = Object.create(null);
  var nodes = Ns.filter(function (n) {
    var ok = !!(n && isStr(n.id) && !seen[n.id] && G[n.g] && isNum(n.x) && isNum(n.y) && isStr(n.title) && Array.isArray(n.what));
    if (ok) seen[n.id] = 1;
    return ok;
  });
  var edges = Es.filter(function (e) { return Array.isArray(e) && seen[e[0]] && seen[e[1]] && e[0] !== e[1]; });
  var journey = Js.filter(function (s) { return !!(s && seen[s.id]); });
  return { groups: G, nodes: nodes, edges: edges, zones: zones, journey: journey };
}
/* ══════════ VALIDATOR END ══════════ */
var WORLD_PAD = 40;  /* margin around the outermost zone */

/* ══ read DATA defensively (a deleted declaration must report, not throw), apply SITE, validate ══ */
var RAW = {
  SITE: typeof SITE === "undefined" ? undefined : SITE,
  GROUPS: typeof GROUPS === "undefined" ? undefined : GROUPS,
  NODES: typeof NODES === "undefined" ? undefined : NODES,
  EDGES: typeof EDGES === "undefined" ? undefined : EDGES,
  ZONES: typeof ZONES === "undefined" ? undefined : ZONES,
  JOURNEY: typeof JOURNEY === "undefined" ? undefined : JOURNEY
};
var S = (RAW.SITE && typeof RAW.SITE === "object") ? RAW.SITE : {};
if (typeof S.title === "string") { document.title = S.title; document.querySelector(".bar .title").lastChild.textContent = " " + S.title; }
if (typeof S.journeyHint === "string") document.getElementById("jtoggle").title = S.journeyHint;
document.getElementById("j-label").textContent = typeof S.journeyLabel === "string" ? S.journeyLabel : "";
if (typeof S.fieldGuideHref === "string") document.getElementById("fg-link").href = S.fieldGuideHref;
(function () {
  var problems = validateMapData(RAW.SITE, RAW.GROUPS, RAW.NODES, RAW.EDGES, RAW.ZONES, RAW.JOURNEY);
  if (!problems.length) return;
  problems.forEach(function (m) { console.warn("knowledge-map DATA: " + m); });
  var w = document.getElementById("datawarn");
  w.innerHTML = problems.length + " DATA problem" + (problems.length > 1 ? "s" : "") +
    " — fix before shipping (also listed in the console; click to dismiss)<ul>" +
    problems.map(function (m) { return "<li>" + m.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</li>"; }).join("") + "</ul>";
  w.hidden = false;
  w.addEventListener("click", function () { w.hidden = true; });
})();

/* ══ theme (same key as the site) ══ */
(function () {
  var root = document.documentElement, KEY = (typeof S.themeKey === "string" && S.themeKey) ? S.themeKey : "SITE-KEY-theme";
  var buttons = document.querySelectorAll(".theme-switch button");
  function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function applyT(mode) {
    if (mode === "light" || mode === "dark") root.setAttribute("data-theme", mode);
    else { root.removeAttribute("data-theme"); mode = "auto"; }
    buttons.forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-set") === mode)); });
  }
  buttons.forEach(function (b) {
    b.addEventListener("click", function () {
      var mode = b.getAttribute("data-set");
      try { if (mode === "auto") localStorage.removeItem(KEY); else localStorage.setItem(KEY, mode); } catch (e) {}
      applyT(mode);
    });
  });
  applyT(stored());
})();

/* ══ the engine builds over the well-formed subset only ══ */
var D = normalizeMapData(RAW.GROUPS, RAW.NODES, RAW.EDGES, RAW.ZONES, RAW.JOURNEY);

/* ══ state ══ */
var byId = Object.create(null); D.nodes.forEach(function(n){ byId[n.id] = n; });
var stageOf = Object.create(null); D.journey.forEach(function(s){ (stageOf[s.id] = stageOf[s.id] || []).push(s.n); });
var world = document.getElementById("world");
var svg = document.getElementById("edges");
var offGroups = Object.create(null);
var selected = null, journeyOn = false, jIndex = 0;

/* ══ world size from the data ══ */
var BB = { x1: Infinity, y1: Infinity, x2: 0, y2: 0 };
D.zones.forEach(function(z){ BB.x1 = Math.min(BB.x1, z[1]); BB.y1 = Math.min(BB.y1, z[2]); BB.x2 = Math.max(BB.x2, z[1] + z[3]); BB.y2 = Math.max(BB.y2, z[2] + z[4]); });
D.nodes.forEach(function(n){ BB.x1 = Math.min(BB.x1, n.x - NODE_W / 2); BB.y1 = Math.min(BB.y1, n.y - NODE_H / 2); BB.x2 = Math.max(BB.x2, n.x + NODE_W / 2); BB.y2 = Math.max(BB.y2, n.y + NODE_H / 2); });
world.style.width = (BB.x2 + WORLD_PAD) + "px"; world.style.height = (BB.y2 + WORLD_PAD) + "px";

/* ══ build zones + nodes ══ */
D.zones.forEach(function(z){
  var d = document.createElement("div");
  d.className = "gzone"; d.style.cssText = "--c:" + D.groups[z[0]].c + ";left:" + z[1] + "px;top:" + z[2] + "px;width:" + z[3] + "px;height:" + z[4] + "px";
  d.innerHTML = '<span class="gl">' + D.groups[z[0]].name + "</span>";
  world.appendChild(d);
});
D.nodes.forEach(function(n){
  var d = document.createElement("div");
  d.className = "node"; d.id = "n-" + n.id; d.tabIndex = 0;
  d.style.cssText = "--c:" + D.groups[n.g].c + ";left:" + n.x + "px;top:" + n.y + "px";
  var stg = stageOf[n.id] ? '<span class="stg">' + stageOf[n.id].join("·") + "</span>" : "";
  d.innerHTML = stg + '<p class="nt">' + n.title + '</p><span class="ng">' + D.groups[n.g].name + "</span>";
  d.addEventListener("click", function(e){ e.stopPropagation(); select(n.id); });
  d.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(n.id); } });
  d.addEventListener("mouseenter", function(e){ peekNode(n, d); });
  d.addEventListener("mouseleave", hidePeek);
  world.appendChild(d);
});

/* ══ edges: orthogonal (H/V only) routes with rounded bends and bridge hops ══ */
var drawn = [];
D.edges.forEach(function(e, i){ if (!e[3]) drawn.push(i); });

/* pick the candidate that crosses no node; if all do (the validator has already flagged it), the fewest-bends least-crossing one */
function route(aN, bN) {
  var cands = routeCandidates({ x: aN.x, y: aN.y }, { x: bN.x, y: bN.y });
  var best = cands[0], bs = 1e9;
  cands.forEach(function(c){
    var s = (c.length - 2) * 1.5 + routeHits(c, D.nodes, aN.id, bN.id, stageOf).length * 1000;
    if (s < bs) { bs = s; best = c; }
  });
  return best;
}
/* build a path with rounded bends (cr) and hop arcs (r) over prior perpendicular segments */
function buildPath(ptsIn, prior) {
  var r = 8, cr = 7;
  var pts = ptsIn.map(function(p){ return { x: p.x, y: p.y }; });
  var d = "M" + pts[0].x + " " + pts[0].y;
  for (var k = 0; k < pts.length - 1; k++) {
    var p = pts[k], q = pts[k+1];
    var ux = Math.sign(q.x - p.x), uy = Math.sign(q.y - p.y);
    var isLast = (k === pts.length - 2);
    var endX = isLast ? q.x : q.x - ux * cr;
    var endY = isLast ? q.y : q.y - uy * cr;
    var hops = [];
    prior.forEach(function(s){
      if (uy === 0 && s.x1 === s.x2) { /* our H vs their V */
        var x = s.x1, ylo = Math.min(s.y1, s.y2) + 4, yhi = Math.max(s.y1, s.y2) - 4;
        var xlo = Math.min(p.x, endX) + r + 2, xhi = Math.max(p.x, endX) - r - 2;
        if (p.y > ylo && p.y < yhi && x > xlo && x < xhi) hops.push(x);
      } else if (ux === 0 && s.y1 === s.y2) { /* our V vs their H */
        var y = s.y1, xlo2 = Math.min(s.x1, s.x2) + 4, xhi2 = Math.max(s.x1, s.x2) - 4;
        var ylo2 = Math.min(p.y, endY) + r + 2, yhi2 = Math.max(p.y, endY) - r - 2;
        if (p.x > xlo2 && p.x < xhi2 && y > ylo2 && y < yhi2) hops.push(y);
      }
    });
    hops.sort(function(m, n){ return (ux + uy > 0) ? m - n : n - m; });
    var last = null;
    hops.forEach(function(h){
      if (last !== null && Math.abs(h - last) < r * 2 + 2) return;
      last = h;
      if (uy === 0) d += " L" + (h - ux * r) + " " + p.y + " A" + r + " " + r + " 0 0 1 " + (h + ux * r) + " " + p.y;
      else d += " L" + p.x + " " + (h - uy * r) + " A" + r + " " + r + " 0 0 1 " + p.x + " " + (h + uy * r);
    });
    d += " L" + endX + " " + endY;
    if (!isLast) {
      var nq = pts[k+2];
      var vx = Math.sign(nq.x - q.x), vy = Math.sign(nq.y - q.y);
      d += " Q" + q.x + " " + q.y + " " + (q.x + vx * cr) + " " + (q.y + vy * cr);
      pts[k+1] = { x: q.x + vx * cr, y: q.y + vy * cr };
    }
  }
  return d;
}
var NS = "http://www.w3.org/2000/svg";
var priorSegs = [];
D.edges.forEach(function(e, i){
  if (e[3]) return; /* panel-only relation, not drawn */
  var pts = route(byId[e[0]], byId[e[1]]);
  var p = document.createElementNS(NS, "path");
  p.setAttribute("class", "e"); p.setAttribute("d", buildPath(pts, priorSegs)); p.id = "e-" + i;
  svg.appendChild(p);
  var h = document.createElementNS(NS, "path");
  var hd = "M" + pts.map(function(pt){ return pt.x + " " + pt.y; }).join(" L");
  h.setAttribute("class", "hit"); h.setAttribute("d", hd);
  h.addEventListener("mouseenter", function(ev){ peekEdge(e, ev); p.classList.add("hl"); });
  h.addEventListener("mousemove", function(ev){ movePeek(ev.clientX + 14, ev.clientY + 14); });
  h.addEventListener("mouseleave", function(){ hidePeek(); if (selected === null) p.classList.remove("hl"); else refresh(); });
  svg.appendChild(h);
  priorSegs = priorSegs.concat(segsOf(pts));
});
/* journey path — orthogonal legs, rounded bends, no hops */
var jp = document.createElementNS(NS, "path");
jp.setAttribute("class", "j");
var jd = "";
for (var ji = 0; ji < D.journey.length - 1; ji++) {
  var leg = route(byId[D.journey[ji].id], byId[D.journey[ji + 1].id]);
  var legD = buildPath(leg, []);
  jd += ji === 0 ? legD : " " + legD;
}
jp.setAttribute("d", jd);
svg.appendChild(jp);

/* ══ legend ══ */
var legend = document.getElementById("legend");
Object.keys(D.groups).forEach(function(g){
  var b = document.createElement("button");
  b.type = "button"; b.setAttribute("aria-pressed", "true");
  b.className = "lg"; b.style.cssText = "--c:" + D.groups[g].c;
  b.textContent = D.groups[g].name;
  b.title = "Click to dim/undim this group";
  b.addEventListener("click", function(){ offGroups[g] = !offGroups[g]; b.classList.toggle("off", !!offGroups[g]); b.setAttribute("aria-pressed", String(!offGroups[g])); refresh(); });
  legend.appendChild(b);
});

/* ══ peek card ══ */
var peek = document.getElementById("peek");
function movePeek(x, y) {
  var w = 300, h = peek.offsetHeight || 120;
  if (x + w + 10 > innerWidth) x = innerWidth - w - 10;
  if (y + h + 10 > innerHeight) y = y - h - 24;
  peek.style.left = x + "px"; peek.style.top = y + "px";
}
function peekNode(n, el) {
  var stg = stageOf[n.id] ? " · journey stage " + stageOf[n.id].join(", ") : "";
  peek.style.cssText = "--pc:" + D.groups[n.g].c;
  peek.innerHTML = '<span class="pg">' + D.groups[n.g].name + stg + '</span><p class="pt">' + n.title + '</p><p class="pd">' + n.teaser + '</p><p class="pf">click to read → topics/' + n.id + ".html</p>";
  var r = el.getBoundingClientRect();
  peek.classList.add("show");
  movePeek(r.right + 12, r.top - 8);
}
function peekEdge(e, ev) {
  peek.style.cssText = "--pc:var(--accent)";
  peek.innerHTML = '<span class="pg">connection</span><p class="pt">' + byId[e[0]].title + " ⟷ " + byId[e[1]].title + '</p><p class="pd">' + e[2] + "</p>";
  peek.classList.add("show");
  movePeek(ev.clientX + 14, ev.clientY + 14);
}
function hidePeek() { peek.classList.remove("show"); }

/* ══ selection + panel ══ */
var panel = document.getElementById("panel");
var lastFocus = null;
function neighbors(id) {
  var out = [];
  D.edges.forEach(function(e){
    if (e[0] === id) out.push({ id: e[1], why: e[2], u: e[3] });
    else if (e[1] === id) out.push({ id: e[0], why: e[2], u: e[3] });
  });
  return out;
}
function select(id) {
  var wasOpen = panel.classList.contains("open");
  selected = id;
  var n = byId[id];
  document.getElementById("n-" + id).classList.add("visited");
  panel.style.setProperty("--pc", D.groups[n.g].c);
  document.getElementById("p-group").textContent = D.groups[n.g].name;
  document.getElementById("p-title").textContent = n.title;
  var st = document.getElementById("p-stage");
  if (stageOf[id]) { st.hidden = false; st.textContent = "Journey stage " + stageOf[id].join(", ") + " — " + D.journey.filter(function(s){ return s.id === id; }).map(function(s){ return s.t; }).join("; "); }
  else st.hidden = true;
  document.getElementById("p-lead").textContent = n.teaser;
  var fl = document.getElementById("p-facts"); fl.innerHTML = "";
  n.what.forEach(function(f){ var li = document.createElement("li"); li.innerHTML = f; fl.appendChild(li); });
  document.getElementById("p-open").href = "topics/" + id + ".html";
  var conn = document.getElementById("p-conn"); conn.innerHTML = "";
  var ns = neighbors(id);
  document.getElementById("p-clabel").textContent = ns.length ? "Connected topics — " + ns.length : "No mapped connections";
  ns.forEach(function(c){
    var m = byId[c.id];
    var b = document.createElement("button");
    b.type = "button"; b.style.cssText = "--cc:" + D.groups[m.g].c;
    b.innerHTML = '<span class="cn">' + m.title + (c.u ? ' <span style="font-weight:500;color:var(--ink-faint);font-size:10px">related · not drawn</span>' : '') + '</span><span class="cw">' + c.why + "</span>";
    b.addEventListener("click", function(){ select(c.id); flyTo(c.id); });
    conn.appendChild(b);
  });
  panel.removeAttribute("inert");
  panel.classList.add("open");
  if (!wasOpen) lastFocus = document.activeElement;
  if (!wasOpen || !panel.contains(document.activeElement)) document.querySelector("#panel .close").focus();
  refresh();
}
function deselect() {
  var wasOpen = panel.classList.contains("open");
  selected = null;
  panel.classList.remove("open");
  panel.setAttribute("inert", "");
  if (journeyOn) setJourney(false);
  if (wasOpen && lastFocus && document.contains(lastFocus) && (document.activeElement === document.body || panel.contains(document.activeElement))) lastFocus.focus();
  lastFocus = null;
  refresh();
}
document.querySelector("#panel .close").addEventListener("click", deselect);
document.addEventListener("keydown", function(e){ if (e.key === "Escape") deselect(); });

function refresh() {
  var nbr = Object.create(null);
  if (selected) { nbr[selected] = 1; neighbors(selected).forEach(function(c){ nbr[c.id] = 1; }); }
  D.nodes.forEach(function(n){
    var el = document.getElementById("n-" + n.id);
    el.classList.toggle("sel", n.id === selected);
    var dim = offGroups[n.g] || (selected && !nbr[n.id]);
    if (journeyOn) dim = !stageOf[n.id] || offGroups[n.g];
    el.classList.toggle("dim", !!dim);
  });
  D.edges.forEach(function(e, i){
    var p = document.getElementById("e-" + i);
    if (!p) return; /* panel-only relation */
    var touch = selected && (e[0] === selected || e[1] === selected);
    p.classList.toggle("hl", !!touch);
    if (touch) p.style.setProperty("--hlc", D.groups[byId[selected].g].c);
    var dim = offGroups[byId[e[0]].g] || offGroups[byId[e[1]].g] || (selected && !touch) || journeyOn;
    p.classList.toggle("dim", !!dim);
  });
}

/* ══ journey mode ══ */
var jpanel = document.getElementById("jpanel");
var jsegs = document.getElementById("jsegs");
D.journey.forEach(function(s, i){
  var b = document.createElement("button");
  b.type = "button"; b.textContent = s.n; b.title = "Stage " + s.n + " — " + s.t;
  b.addEventListener("click", function(){ jIndex = i; jStep(0); });
  jsegs.appendChild(b);
});
jsegs.style.gridTemplateColumns = "repeat(" + D.journey.length + ", minmax(0, 1fr))";
if (!D.journey.length) document.getElementById("jtoggle").hidden = true;
function setJourney(on) {
  if (!D.journey.length) return;
  journeyOn = on;
  document.getElementById("jtoggle").classList.toggle("on", on);
  jp.classList.toggle("on", on);
  jpanel.hidden = !on;
  if (on) { jIndex = 0; jStep(0); } else refresh();
}
function jStep(delta) {
  jIndex = Math.max(0, Math.min(D.journey.length - 1, jIndex + delta));
  var s = D.journey[jIndex];
  document.getElementById("j-step").textContent = "stage " + s.n + " of " + D.journey.length;
  document.getElementById("j-desc").innerHTML = "<b>" + s.t + ".</b> " + s.d;
  document.getElementById("j-prev").disabled = jIndex === 0;
  document.getElementById("j-next").disabled = jIndex === D.journey.length - 1;
  var kids = jsegs.children;
  for (var i = 0; i < kids.length; i++) {
    kids[i].className = i < jIndex ? "done" : (i === jIndex ? "cur" : "");
  }
  select(s.id);
  flyTo(s.id);
}
document.getElementById("jtoggle").addEventListener("click", function(){ setJourney(!journeyOn); });
document.getElementById("j-prev").addEventListener("click", function(){ jStep(-1); });
document.getElementById("j-next").addEventListener("click", function(){ jStep(1); });
document.addEventListener("keydown", function(e){
  if (!journeyOn) return;
  if (e.key === "ArrowRight") { e.preventDefault(); jStep(1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); jStep(-1); }
});

/* ══ pan / zoom ══ */
var vp = document.getElementById("viewport");
var bar = document.querySelector(".bar");
function barHeight() { return bar.offsetHeight || 52; }
function syncBar() { document.documentElement.style.setProperty("--bar-h", barHeight() + "px"); }
var tx = 0, ty = 0, scale = 1;
function apply() { world.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")"; }
function fit() {
  var pad = WORLD_PAD, bh = barHeight(), W = BB.x2 - BB.x1, H = BB.y2 - BB.y1;
  scale = Math.min((innerWidth - 2 * pad) / W, (innerHeight - bh - 2 * pad) / H, 1.2);
  tx = (innerWidth - W * scale) / 2 - BB.x1 * scale;
  ty = bh + (innerHeight - bh - H * scale) / 2 - BB.y1 * scale;
  apply();
}
function flyTo(id) {
  var n = byId[id];
  var target = Math.max(scale, 0.9);
  scale = target;
  tx = innerWidth / 2 - n.x * scale - (panel.classList.contains("open") ? 200 : 0);
  ty = barHeight() + (innerHeight - barHeight()) / 2 - n.y * scale;
  world.style.transition = "transform .35s ease";
  apply();
  setTimeout(function(){ world.style.transition = ""; }, 380);
}
var pan = null;
vp.addEventListener("pointerdown", function(e){
  if (e.target.closest(".node")) return;
  pan = { x: e.clientX, y: e.clientY, tx: tx, ty: ty };
  vp.classList.add("panning"); vp.setPointerCapture(e.pointerId);
});
vp.addEventListener("pointermove", function(e){
  if (!pan) return;
  tx = pan.tx + e.clientX - pan.x; ty = pan.ty + e.clientY - pan.y; apply();
});
vp.addEventListener("pointerup", function(e){
  vp.classList.remove("panning");
  if (pan && Math.abs(e.clientX - pan.x) < 4 && Math.abs(e.clientY - pan.y) < 4) deselect();
  pan = null;
});
vp.addEventListener("wheel", function(e){
  e.preventDefault();
  var f = e.deltaY < 0 ? 1.1 : 0.9;
  var ns = Math.max(0.35, Math.min(2.2, scale * f));
  tx = e.clientX - (e.clientX - tx) * (ns / scale);
  ty = e.clientY - (e.clientY - ty) * (ns / scale);
  scale = ns; apply();
}, { passive: false });
document.getElementById("z-in").addEventListener("click", function(){ zoomAt(innerWidth/2, innerHeight/2, 1.2); });
document.getElementById("z-out").addEventListener("click", function(){ zoomAt(innerWidth/2, innerHeight/2, 1/1.2); });
document.getElementById("z-fit").addEventListener("click", fit);
function zoomAt(cx, cy, f) {
  var ns = Math.max(0.35, Math.min(2.2, scale * f));
  tx = cx - (cx - tx) * (ns / scale); ty = cy - (cy - ty) * (ns / scale);
  scale = ns; apply();
}
addEventListener("resize", function(){ syncBar(); fit(); });
syncBar();
fit();

</script>
